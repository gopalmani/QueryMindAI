services:
  - type: web
    name: querymind-api
    plan: free
    runtime: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: cd apps/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: ENABLE_EXTERNAL_CONNECTIONS
        value: "true"
      - key: ALLOW_PRIVATE_DATABASE_HOSTS
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: CONNECTION_ENCRYPTION_KEY
        sync: false
      - key: AUTH_SIGNING_KEY
        sync: false
      - key: DATABASE_CONNECTION_TIMEOUT_SECONDS
        value: "5"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_MAX_RESULT_ROWS
        value: "500"
      - key: DATABASE_MAX_SQL_LENGTH
        value: "10000"
      - key: SCHEMA_FULL_CONTEXT_TABLE_LIMIT
        value: "20"
      - key: SCHEMA_RETRIEVAL_TABLE_LIMIT
        value: "8"
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ENABLE_SCHEMA_RAG
        value: "false"
      - key: ENABLE_GOLDEN_RECORDS
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        sync: false
  - type: web
    name: querymind-web
    plan: free
    runtime: node
    buildCommand: cd apps/web && npm ci && npm run build
    startCommand: cd apps/web && npm run start -- -p $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NEXT_PUBLIC_API_URL
        sync: false
